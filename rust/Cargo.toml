[package]
name = "stutools"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["Stuart Inglis <stuart.inglis@gmail.com>"]
license = "Apache-2.0"
description = "Stu's powerful I/O tester"
repository = "https://github.com/dr-who/stutools"

[[bin]]
name = "spit"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = { version = "0.7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
