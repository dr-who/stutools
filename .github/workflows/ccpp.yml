name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo ./c/install-deps.sh --build-only
      - run: make -C c test JOBS=4
  rust-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libaio-dev
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo +stable fmt --manifest-path rust/Cargo.toml --check
      - run: cargo +stable clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +stable test --manifest-path rust/Cargo.toml --release --locked
      - run: cargo +stable build --manifest-path rust/Cargo.toml --release --locked
      - if: runner.os == 'macOS'
        run: |
          python3 rust/packaging/build.py tar
          python3 rust/packaging/build.py pkg
      - if: runner.os == 'Windows'
        run: python rust/packaging/build.py zip
      - uses: actions/upload-artifact@v4
        with:
          name: spit-${{ runner.os }}-${{ runner.arch }}
          path: |
            rust/target/release/spit
            rust/target/release/spit.exe
            rust/dist/spit-*.tar.gz
            rust/dist/spit-*.zip
            rust/dist/spit-*.pkg
  rust-packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            image: docker.io/library/debian:12
          - distro: mint22
            image: docker.io/linuxmintd/mint22-amd64:latest
          - distro: rocky9
            image: docker.io/library/rockylinux:9
          - distro: alma9
            image: docker.io/library/almalinux:9
          - distro: fedora
            image: registry.fedoraproject.org/fedora:latest
          - distro: rhel9-ubi
            image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - run: python3 rust/packaging/source.py
      - name: Build, test and install the package
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          toolchain=$(dirname "$(dirname "$(rustup which rustc)")")
          mkdir -p rust/dist/packages
          archive=$(python3 -c 'import pathlib,re; print("stutools-" + re.search(r"^version = \"([^\"]+)\"", pathlib.Path("rust/Cargo.toml").read_text(),re.M)[1] + ".tar.gz")')
          docker run --rm --user 0 --security-opt seccomp=unconfined \
            -e "STUTOOLS_SOURCE_ARCHIVE=$archive" \
            -v "$toolchain:/opt/rust:ro" \
            -v "$PWD/rust/dist:/input:ro" \
            -v "$PWD/rust/packaging:/scripts:ro" \
            -v "$PWD/rust/dist/packages:/artifacts" \
            "$IMAGE" sh /scripts/container-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stutools-${{ matrix.distro }}
          path: rust/dist/packages/
  bsd-native:
    name: Rust and C (${{ matrix.os }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd-15.1, openbsd-7.9]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare locked, offline Rust sources
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          python3 rust/packaging/source.py
      - name: Build and test in FreeBSD
        if: matrix.os == 'freebsd-15.1'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '15.1'
          mem: 6144
          prepare: pkg install -y rust cmake ninja
          run: sh .github/scripts/bsd-build.sh
      - name: Build and test in OpenBSD
        if: matrix.os == 'openbsd-7.9'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        with:
          release: '7.9'
          mem: 6144
          prepare: pkg_add -I rust cmake ninja
          run: sh .github/scripts/bsd-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: spit-${{ matrix.os }}
          path: rust/dist/spit-*.tar.gz
          if-no-files-found: error
